version: 2

models:
  - name: stg_listings
    columns:
      - name: listing_id
        tests:
          - not_null
          - unique

      - name: price
        tests:
          - not_null

      - name: room_type
        tests:
          - not_null

  - name: stg_reviews
    columns:
      - name: listing_id
        tests:
          - not_null

  - name: dim_listings
    columns:
      - name: listing_id
        tests:
          - not_null
          - unique

  - name: stg_hosts
    description: "Staging model containing cleaned host information from Airbnb listings data."
    columns:
      - name: host_id
        description: "Unique identifier for each host."
        tests:
          - not_null
          